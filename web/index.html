<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073E47">
  <meta name="description" content="TrekIt is a private adventure journal for capturing trips and sharing memories with people you trust.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrekIt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="trekit-favicon.png"/>

  <title>TrekIt | Private Adventure Journal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Preserve the browser's one-time install prompt until the user chooses
    // Install from TrekIt's Profile page.
    window.trekitDeferredInstallPrompt = null;
    window.trekitWasInstalled = false;
    window.trekitCanInstall = () => window.trekitDeferredInstallPrompt !== null;
    window.trekitIsStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true ||
      window.trekitWasInstalled;
    window.trekitPromptInstall = async () => {
      const prompt = window.trekitDeferredInstallPrompt;
      if (!prompt) return false;
      prompt.prompt();
      const choice = await prompt.userChoice;
      window.trekitDeferredInstallPrompt = null;
      window.trekitWasInstalled = choice.outcome === 'accepted';
      return choice.outcome === 'accepted';
    };
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.trekitDeferredInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      window.trekitDeferredInstallPrompt = null;
      window.trekitWasInstalled = true;
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
